name: Sync official Applyhome data

on:
  schedule:
    # UTC 00:37 / 06:37 = 한국시간 09:37 / 15:37. 실행은 지연될 수 있습니다.
    - cron: '37 0,6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: applyhome-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Test UI states
        run: node --test tests/ui-status.test.cjs
      - name: Fetch official data
        id: sync
        continue-on-error: true
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
        run: python scripts/sync_applyhome.py
      # 공고문 PDF를 Claude로 분석해 조건별 근거를 붙인다. 실패해도 공고 데이터 갱신·배포는 계속한다.
      - name: Install Claude Code CLI (subscription analysis)
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Analyze notices (auto eligibility)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/auto_eligibility.py
      - name: Save data and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/sync-status.json data/auto-eligibility.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official listings and sync status'
            # 실행 중에 다른 커밋이 main에 올라왔으면 그 위로 다시 쌓은 뒤 push한다.
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
              echo "push 재시도 ${attempt}"; sleep 5
            done
            if [ "$pushed" -ne 1 ]; then echo '::error::Data commit could not be pushed.'; exit 1; fi
          fi
      # GITHUB_TOKEN으로 만든 커밋은 Pages 빌드를 유발하지 않으므로 명시적으로 배포한다.
      # 실패 시에도 마지막 정상 공고와 갱신 실패 상태를 배포한다.
      - name: Prepare public site only
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js sw.js manifest.webmanifest favicon.svg *.png _site/
          cp data/listings.json data/sync-status.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for deployment artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.artifacts | length')
            if [ "$count" -gt 0 ]; then
              echo 'Deployment artifact is available.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Deployment artifact did not become available in time.'
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report failed refresh
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::Official data refresh failed; previous data and error status were retained.'
          exit 1
